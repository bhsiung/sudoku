<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level-by-Level Sudoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen column — stage header, 160-step progress trail, board with an FX layer on top, number pad. */
:root{
  --bg:#E9EFEC; --surface:#FBFCFB; --ink:#16262B; --muted:#5D6F72; --line:#C9D4D1; --line-strong:#16262B;
  --user:#2B5BC8; --sel:#CFE6DC; --peer:#E2ECE8; --same:#B7DCCB; --bad:#C8343B; --bad-bg:#F7DADB; --glow:#FFD54A;
  --easy:#2F8F5B; --mid:#2B6FB8; --hard:#6B47B8; --ultra:#B23A48; --stage:var(--easy);
  --f-display:"Bricolage Grotesque", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#172427; --ink:#E4EDEA; --muted:#93A6A6; --line:#2C3D40; --line-strong:#A9BDB8;
  --user:#86A9FF; --sel:#244A3E; --peer:#1D3134; --same:#2F5E4E; --bad:#FF7A7F; --bad-bg:#4A2026; --glow:#FFE07A;
  --easy:#5BC48A; --mid:#6BA6EC; --hard:#A98BF0; --ultra:#F07C88; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#172427; --ink:#E4EDEA; --muted:#93A6A6; --line:#2C3D40; --line-strong:#A9BDB8;
  --user:#86A9FF; --sel:#244A3E; --peer:#1D3134; --same:#2F5E4E; --bad:#FF7A7F; --bad-bg:#4A2026; --glow:#FFE07A;
  --easy:#5BC48A; --mid:#6BA6EC; --hard:#A98BF0; --ultra:#F07C88; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1;margin:4px 0 0;font-variant-numeric:tabular-nums}
h1 small{font-size:.45em;font-weight:500;color:var(--muted);margin-left:6px}
.iconbtn{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.iconbtn:focus-visible,.key:focus-visible,.tool:focus-visible,.lv:focus-visible{outline:2px solid var(--stage);outline-offset:2px}
.trail,.trail-labels{display:grid;grid-template-columns:20fr 20fr 100fr 20fr;gap:4px}
.seg{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;width:0;border-radius:3px;transition:width .6s ease}
.trail-labels{font-size:11px;color:var(--muted);margin-top:4px}
.stage-wrap{position:relative}
.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;max-width:100%;background:var(--surface);
  border:2px solid var(--line-strong);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.cell{position:relative;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--f-display);font-size:clamp(20px,6.4vw,28px);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.cell:nth-child(9n){border-right:none}
.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--line-strong)}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line-strong)}
.cell:nth-child(n+73){border-bottom:none}
.cell.given{color:var(--ink)}
.cell.user{color:var(--user);font-weight:500}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--stage)}
.cell.bad{color:var(--bad);background:var(--bad-bg)}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(8px,2.3vw,11px);font-weight:500;color:var(--muted);line-height:1}
.notes span{display:grid;place-items:center}

/* FX layer: sits over the board, never touched by render() */
.fx{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(9,1fr);pointer-events:none;border-radius:4px;overflow:hidden}
.fx div{position:relative}
.fx div.go::before{content:"";position:absolute;inset:0;background:var(--stage);opacity:0;animation:sweep .7s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0ms)}
.fx div.go::after{content:"";position:absolute;left:50%;top:50%;width:10%;aspect-ratio:1;border-radius:50%;background:var(--glow);
  box-shadow:0 0 8px 2px var(--glow);transform:translate(-50%,-50%) scale(0);opacity:0;animation:spark .7s ease-out both;animation-delay:calc(var(--d,0ms) + 80ms)}
@keyframes sweep{0%{opacity:0;transform:scale(.4)}35%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}40%{opacity:1;transform:translate(-50%,-50%) scale(2.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}
.callout{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;
  font-family:var(--f-display);font-weight:800;letter-spacing:.02em;color:var(--surface);background:var(--stage);
  padding:8px 16px;border-radius:999px;box-shadow:0 6px 24px color-mix(in srgb,var(--stage) 45%,transparent);animation:callout 1.1s cubic-bezier(.2,.8,.3,1) both}
.callout small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.callout.c1{font-size:22px}.callout.c2{font-size:28px}.callout.c3{font-size:34px;background:linear-gradient(90deg,var(--stage),var(--glow),var(--stage));color:var(--ink)}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,-60%)}100%{opacity:0;transform:translate(-50%,-90%)}}
.board.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-3px,1px) rotate(-.4deg)}50%{transform:translate(3px,-1px) rotate(.4deg)}75%{transform:translate(-2px,0)}}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{font:inherit;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 0;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--stage);border-color:var(--stage);color:var(--surface);font-weight:700}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,6vw,26px);background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:10px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.key small{font-family:var(--f-body);font-size:10px;font-weight:400;color:var(--muted)}
.key.done{opacity:.35}
.key:active,.tool:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:400px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.card h2{font-family:var(--f-display);font-weight:800;font-size:30px;margin:0;color:var(--stage);text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.6}
.primary{font:inherit;font-weight:700;font-size:16px;background:var(--stage);color:var(--surface);border:none;border-radius:12px;padding:14px;cursor:pointer}
.lvgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.lvhead{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:6px}
.lv{font:inherit;font-size:12px;font-variant-numeric:tabular-nums;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.lv.cleared{background:var(--peer)}
.lv.cur{border:2px solid var(--stage);font-weight:700}
.lv:disabled{opacity:.3;cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.cell.pop{animation:pop .35s ease}
@media (prefers-reduced-motion:reduce){
  .cell.pop,.board.shake{animation:none}
  .fx div.go::after{display:none}
  .fx div.go::before{animation:fade .8s ease both;animation-delay:0ms}
  .callout{animation:fade 1.1s ease both}
  @keyframes fade{0%,100%{opacity:0}30%,70%{opacity:.6}}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div>
      <div class="eyebrow" id="stageName">Easy · 9 blanks</div>
      <h1 id="levelTitle">Level 1<small>/ 160</small></h1>
    </div>
    <button class="iconbtn" id="mapBtn" type="button">Levels</button>
  </header>
  <div>
    <div class="trail" id="trail"></div>
    <div class="trail-labels"><span>Easy</span><span>Medium</span><span>Hard</span><span>Expert</span></div>
  </div>
  <div class="stage-wrap">
    <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>
    <div id="callouts" aria-live="polite"></div>
  </div>
  <div class="tools">
    <button class="tool" id="notesBtn" type="button" aria-pressed="false">Notes</button>
    <button class="tool" id="eraseBtn" type="button">Erase</button>
    <button class="tool" id="undoBtn" type="button">Undo</button>
  </div>
  <div class="pad" id="pad"></div>
  <p class="hint" id="hint">Tap a cell, then tap a number.</p>
</div>

<div class="overlay" id="win" hidden>
  <div class="card">
    <h2 id="winTitle">Level clear!</h2>
    <p id="winText"></p>
    <button class="primary" id="nextBtn" type="button">Next level</button>
  </div>
</div>

<div class="overlay" id="map" hidden>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="color:var(--ink);font-size:24px">Levels</h2>
      <button class="iconbtn" id="mapClose" type="button">Close</button>
    </div>
    <div id="lvlist"></div>
  </div>
</div>

const STAGES = {Easy:{c:"--easy",d:"9 blanks"},Medium:{c:"--mid",d:"30 blanks"},Hard:{c:"--hard",d:"50 blanks"},Expert:{c:"--ultra",d:"Minimum clues, one solution"}};
const RANGES = [["Easy",0,20],["Medium",20,40],["Hard",40,140],["Expert",140,160]];
const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let S;
function fresh(idx){
  return {idx, grid:[...LEVELS[idx].p].map(Number), notes:Array.from({length:81},()=>[]), sel:-1, notesMode:false, history:[]};
}
function start(data){
  const unlocked = store.get("sdk_unlocked", 0);
  S = data && data.S ? data.S : (store.get("sdk_state", null) || fresh(Math.min(unlocked,159)));
  S.unlocked = Math.max(unlocked, S.unlocked||0, S.idx);
  buildBoard(); buildPad(); render();
}
function save(){ store.set("sdk_state", S); store.set("sdk_unlocked", S.unlocked); }

const ROW = i=>Array.from({length:9},(_,k)=>Math.floor(i/9)*9+k);
const COL = i=>Array.from({length:9},(_,k)=>k*9+i%9);
const BOX = i=>{const r=Math.floor(i/9),c=i%9,br=r-r%3,bc=c-c%3;return Array.from({length:9},(_,k)=>(br+Math.floor(k/3))*9+bc+k%3)};
const PEERS = Array.from({length:81},(_,i)=>{const s=new Set([...ROW(i),...COL(i),...BOX(i)]);s.delete(i);return s});
function conflicts(){
  const bad=new Set();
  for(let i=0;i<81;i++){const v=S.grid[i]; if(!v) continue; for(const j of PEERS[i]) if(S.grid[j]===v) bad.add(i);}
  return bad;
}

function buildBoard(){
  const b=$("board"), f=$("fx"); b.innerHTML=""; f.innerHTML="";
  for(let i=0;i<81;i++){
    const d=document.createElement("div");d.className="cell";d.setAttribute("role","gridcell");d.dataset.i=i;
    d.addEventListener("click",()=>{S.sel=i;render()}); b.appendChild(d);
    f.appendChild(document.createElement("div"));
  }
}
function buildPad(){
  const p=$("pad"); p.innerHTML="";
  for(let n=1;n<=9;n++){const k=document.createElement("button");k.type="button";k.className="key";k.dataset.n=n;
    k.innerHTML=`${n}<small></small>`; k.addEventListener("click",()=>input(n)); p.appendChild(k);}
}

/* ---- clear detection + effects ---- */
function solved(unit){const s=LEVELS[S.idx].s;return unit.every(j=>S.grid[j]===+s[j])}
function clearedUnits(i){
  const out=[];
  if(solved(ROW(i))) out.push(["Row",ROW(i)]);
  if(solved(COL(i))) out.push(["Column",COL(i)]);
  if(solved(BOX(i))) out.push(["Box",BOX(i)]);
  return out;
}
function playClear(origin, units){
  const fx=$("fx").children, r0=Math.floor(origin/9), c0=origin%9, hit=new Map();
  units.forEach(([,cells],u)=>cells.forEach(j=>{
    const d=Math.max(Math.abs(Math.floor(j/9)-r0),Math.abs(j%9-c0))*55 + u*90;
    if(!hit.has(j)||hit.get(j)>d) hit.set(j,d);
  }));
  for(const [j,d] of hit){
    const el=fx[j]; el.classList.remove("go"); void el.offsetWidth;
    el.style.setProperty("--d",d+"ms"); el.classList.add("go");
    clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("go"), d+900);
  }
  const n=units.length, names=units.map(u=>u[0]);
  const label = n===3 ? "Triple Clear!" : n===2 ? "Double Clear!" : `${names[0]} Clear`;
  const sub = n>1 ? names.join(" + ") : "Nice";
  const c=document.createElement("div"); c.className="callout c"+n;
  c.innerHTML=`${label}<small>${sub}</small>`;
  $("callouts").appendChild(c); setTimeout(()=>c.remove(),1200);
  if(n>=2){const b=$("board");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");}
}

function input(n){
  const i=S.sel; if(i<0) return;
  if(LEVELS[S.idx].p[i]!=="0") return;
  if(S.notesMode && S.grid[i]) return;
  S.history.push({i, v:S.grid[i], notes:[...S.notes[i]]});
  if(S.history.length>300) S.history.shift();
  let fx=[];
  if(S.notesMode){
    const a=S.notes[i]; const k=a.indexOf(n); k>=0?a.splice(k,1):a.push(n);
  } else {
    S.grid[i] = S.grid[i]===n ? 0 : n;
    S.notes[i]=[];
    if(S.grid[i]===n){
      for(const j of PEERS[i]){const a=S.notes[j];const k=a.indexOf(n);if(k>=0)a.splice(k,1)}
      fx=clearedUnits(i);
    }
  }
  render(i);
  if(fx.length) playClear(i, fx);
  check(fx.length);
}
function erase(){const i=S.sel;if(i<0||LEVELS[S.idx].p[i]!=="0")return;
  S.history.push({i,v:S.grid[i],notes:[...S.notes[i]]});S.grid[i]=0;S.notes[i]=[];render();}
function undo(){const h=S.history.pop();if(!h)return;S.grid[h.i]=h.v;S.notes[h.i]=h.notes;S.sel=h.i;render();}

function check(hadFx){
  if(S.grid.join("")!==LEVELS[S.idx].s) return;
  S.unlocked=Math.max(S.unlocked,S.idx+1); save();
  const L=LEVELS[S.idx], next=S.idx+1;
  $("winTitle").textContent = next>=160 ? "All 160 cleared!" : "Level clear!";
  let msg = `Level ${S.idx+1} done.`;
  if(next<160 && LEVELS[next].t!==L.t) msg += ` Next up: the ${LEVELS[next].t} stage, ${STAGES[LEVELS[next].t].d.toLowerCase()}.`;
  if(next>=160) msg = "Every puzzle solved. You own this island.";
  $("winText").textContent=msg;
  $("nextBtn").textContent = next>=160 ? "Play again from Level 1" : "Next level";
  setTimeout(()=>{$("win").hidden=false;$("nextBtn").focus()}, hadFx?1100:350);
}
function go(idx){S={...fresh(idx),unlocked:S.unlocked};$("win").hidden=true;$("map").hidden=true;render();}

function render(popIdx){
  const L=LEVELS[S.idx], st=STAGES[L.t];
  document.documentElement.style.setProperty("--stage",`var(${st.c})`);
  $("stageName").textContent=`${L.t} · ${st.d}`;
  $("levelTitle").innerHTML=`Level ${S.idx+1}<small>/ 160</small>`;
  const t=$("trail"); t.innerHTML="";
  for(const [name,a,b] of RANGES){const done=Math.max(0,Math.min(b,S.unlocked)-a);const seg=document.createElement("div");seg.className="seg";
    seg.innerHTML=`<i style="width:${done/(b-a)*100}%;background:var(${STAGES[name].c})"></i>`;t.appendChild(seg);}
  const bad=conflicts(), sv=S.sel>=0?S.grid[S.sel]:0, pe=S.sel>=0?PEERS[S.sel]:new Set();
  const cells=$("board").children;
  for(let i=0;i<81;i++){
    const c=cells[i], v=S.grid[i], given=L.p[i]!=="0";
    let cls="cell "+(given?"given":"user");
    if(pe.has(i)) cls+=" peer";
    if(sv && v===sv) cls+=" same";
    if(i===S.sel) cls+=" sel";
    if(bad.has(i)&&!given) cls+=" bad";
    if(i===popIdx) cls+=" pop";
    c.className=cls;
    if(v) c.textContent=v;
    else if(S.notes[i].length){c.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(n=>`<span>${S.notes[i].includes(n)?n:""}</span>`).join("")+'</div>'}
    else c.textContent="";
    c.setAttribute("aria-label",`Row ${Math.floor(i/9)+1}, column ${i%9+1}, ${v||"empty"}`);
  }
  const cnt=Array(10).fill(0); S.grid.forEach(v=>cnt[v]++);
  for(const k of $("pad").children){const n=+k.dataset.n;const left=9-cnt[n];k.querySelector("small").textContent=left>0?left:"✓";k.classList.toggle("done",left<=0)}
  $("notesBtn").setAttribute("aria-pressed",S.notesMode);
  $("hint").textContent = S.notesMode ? "Notes mode: numbers go in as small pencil marks." : (bad.size ? "Red cells repeat a number in the same row, column, or box." : "Tap a cell, then tap a number.");
  save();
}

function openMap(){
  const box=$("lvlist"); box.innerHTML="";
  for(const [name,a,b] of RANGES){
    const h=document.createElement("div");h.className="lvhead";h.style.color=`var(${STAGES[name].c})`;h.textContent=`${name} · ${a+1}–${b}`;box.appendChild(h);
    const g=document.createElement("div");g.className="lvgrid";
    for(let i=a;i<b;i++){const btn=document.createElement("button");btn.type="button";btn.className="lv"+(i<S.unlocked?" cleared":"")+(i===S.idx?" cur":"");
      btn.textContent=i+1;btn.disabled=i>S.unlocked;btn.addEventListener("click",()=>go(i));g.appendChild(btn);}
    box.appendChild(g);
  }
  $("map").hidden=false;
}

$("notesBtn").onclick=()=>{S.notesMode=!S.notesMode;render()};
$("eraseBtn").onclick=erase; $("undoBtn").onclick=undo;
$("nextBtn").onclick=()=>go(S.idx+1>=160?0:S.idx+1);
$("mapBtn").onclick=openMap; $("mapClose").onclick=()=>{$("map").hidden=true};
$("map").addEventListener("click",e=>{if(e.target.id==="map")$("map").hidden=true});
document.addEventListener("keydown",e=>{
  if(!$("win").hidden||!$("map").hidden){if(e.key==="Escape")$("map").hidden=true;return}
  if(e.key>="1"&&e.key<="9") input(+e.key);
  else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0") erase();
  else if(e.key==="n"||e.key==="N"){S.notesMode=!S.notesMode;render()}
  else if(e.key.startsWith("Arrow")){e.preventDefault();let i=S.sel<0?0:S.sel;const r=Math.floor(i/9),c=i%9;
    if(e.key==="ArrowUp")i=((r+8)%9)*9+c;if(e.key==="ArrowDown")i=((r+1)%9)*9+c;if(e.key==="ArrowLeft")i=r*9+(c+8)%9;if(e.key==="ArrowRight")i=r*9+(c+1)%9;S.sel=i;render()}
  else if((e.metaKey||e.ctrlKey)&&e.key==="z"){e.preventDefault();undo()}
});

window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
